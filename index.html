  window.reAnalyzeTaskStates = window.reAnalyzeTaskStates || {};

  window.triggerReAnalyzeContent = async function(logId, btnEl) {
    const urls = window.logPlaylists[logId];
    if (!urls || urls.length === 0) {
      alert("此日誌無影音檔案可供解析！");
      return;
    }
    
    const isYouTube = urls[0].includes('youtube.com') || urls[0].includes('youtu.be');
    if (isYouTube) {
       alert("YouTube 影片請透過頂部的 YouTube 解析區塊處理！");
       return;
    }

    if (window.reAnalyzeTaskStates[logId] && window.reAnalyzeTaskStates[logId].status === 'running') {
       alert("此日誌的解析任務正在進行中。");
       return;
    }

    if (!window.reAnalyzeTaskStates[logId] || window.reAnalyzeTaskStates[logId].status === 'stopped') {
       const logItem = globalLogsCache.find(l => l.logId === logId);
       let validTranscripts = [];
       
       
       if (logItem && logItem.content && !logItem.content.includes("純影音建檔中") && !logItem.content.includes("未啟用 AI 解析")) {
           const parts = logItem.content.split(/(?=【第\s*\d+\s*(?:分鐘|段影音|段)】)/).map(p => p.trim()).filter(p => p !== "");
           for (let p of parts) {
               if (p.startsWith("【第") && !p.includes("（解析超時或失敗）") && !p.includes("（AI 解析發生錯誤")) {
                   validTranscripts.push(p);
               } else {
                   break; 
               }
           }
       }
       
       let startIdx = validTranscripts.length;
       if (startIdx >= urls.length) {
           if (!confirm(`系統偵測 ${urls.length} 段影音皆已解析完成。\n確定要強制「全部重新解析」嗎？（將覆蓋現有內容）`)) return;
           validTranscripts = [];
           startIdx = 0;
       } else {
           const confirmMsg = startIdx > 0 
               ? `系統偵測到已完成 ${startIdx} 段解析。\n將從第 ${startIdx + 1} 段接續解析剩餘的 ${urls.length - startIdx} 段，不重複重工！\n確定要執行嗎？` 
               : `將針對 ${urls.length} 個影音切片進行 AI 解析，確定要執行嗎？`;
           if (!confirm(confirmMsg)) return;
       }

       window.reAnalyzeTaskStates[logId] = {
         status: 'running',
         currentIndex: startIdx,
         fullTranscripts: validTranscripts,
         urls: urls
       };
    } else if (window.reAnalyzeTaskStates[logId].status === 'paused') {
       if (!confirm(`要繼續未完成的解析任務嗎？\n(目前進度: ${window.reAnalyzeTaskStates[logId].currentIndex}/${urls.length})`)) return;
       window.reAnalyzeTaskStates[logId].status = 'running';
    }

    const actionsEl = document.getElementById('content-actions-' + logId);
    if (actionsEl) actionsEl.style.display = 'none';

    const progressEl = document.getElementById('reanalyze-header-progress-' + logId);
    if (progressEl) {
      progressEl.style.display = 'flex';
      progressEl.innerHTML = `
        <div id="reanalyze-text-${logId}" style="display:flex; align-items:center;"><i data-lucide="loader" class="spin" style="width:14px; height:14px; margin-right:4px;"></i> 準備解析...</div>
        <div style="display:flex; gap:8px;">
          <button class="action-btn-sm action-btn-icon" onclick="event.stopPropagation(); window.pauseReAnalyze('${logId}')" title="暫停"><i data-lucide="pause" style="width:14px; height:14px;"></i></button>
          <button class="action-btn-sm action-btn-icon danger" onclick="event.stopPropagation(); window.stopReAnalyze('${logId}')" title="停止"><i data-lucide="square" style="width:14px; height:14px;"></i></button>
        </div>
      `;
      lucide.createIcons();
    }

    const originalIconHtml = btnEl ? btnEl.innerHTML : '';
    if (btnEl) {
       btnEl.innerHTML = '<i data-lucide="loader" class="spin" style="width:16px; height:16px;"></i>';
       btnEl.disabled = true;
    }

    window.processReAnalyzeLoop(logId, btnEl, originalIconHtml);
  };

  window.processReAnalyzeLoop = async function(logId, btnEl, originalIconHtml) {
      const state = window.reAnalyzeTaskStates[logId];
      const progressEl = document.getElementById('reanalyze-header-progress-' + logId);
      const textEl = document.getElementById('reanalyze-text-' + logId);
      const actionsEl = document.getElementById('content-actions-' + logId);
      const logItem = globalLogsCache.find(l => l.logId === logId);
      const viewEl = document.getElementById('view-content-' + logId);
      const editInputEl = document.getElementById('input-content-' + logId);

      
      if (state.currentIndex === 0 && state.fullTranscripts.length === 0) {
        if (logItem) logItem.content = "（正在啟動影音切片解析...）";
        if (viewEl) viewEl.innerHTML = '<div style="color:var(--text-muted); font-size:14px; padding:12px 0;"><i data-lucide="loader" class="spin" style="width:14px; height:14px; margin-right:4px;"></i> 準備解析中...</div>';
      }

      try {
        while (state.currentIndex < state.urls.length) {
           if (state.status === 'paused') {
               if (progressEl) {
                 progressEl.innerHTML = `
                    <div id="reanalyze-text-${logId}" style="display:flex; align-items:center;"><i data-lucide="pause-circle" style="width:14px; height:14px; margin-right:4px; color:var(--warning);"></i> 已暫停 (${state.currentIndex}/${state.urls.length})</div>
                    <div style="display:flex; gap:8px;">
                      <button class="action-btn-sm action-btn-icon" onclick="event.stopPropagation(); window.resumeReAnalyze('${logId}')" title="繼續"><i data-lucide="play" style="width:14px; height:14px;"></i></button>
                      <button class="action-btn-sm action-btn-icon danger" onclick="event.stopPropagation(); window.stopReAnalyze('${logId}')" title="停止"><i data-lucide="square" style="width:14px; height:14px;"></i></button>
                    </div>
                 `;
                 lucide.createIcons();
               }
               return; 
           }
           
           if (state.status === 'stopped') {
               throw new Error("USER_STOPPED");
           }

           const i = state.currentIndex;
           if (textEl) textEl.innerHTML = `<i data-lucide="loader" class="spin" style="width:14px; height:14px; margin-right:4px;"></i> 解析第 ${i + 1}/${state.urls.length} 段 (${Math.round((i/state.urls.length)*100)}%)`;
           lucide.createIcons();
           
           const email = localStorage.getItem('bvlog_user_email');
           const res = await api({ action: "reAnalyzeChunk", url: state.urls[i], chunkIndex: i + 1, logId: logId, email: email });
           state.fullTranscripts.push(res.transcript);
           
           const currentContent = state.fullTranscripts.join('|||CHUNK_SPLIT|||');
           await api({ action: "saveReAnalyzedContent", logId: logId, content: currentContent });
           
           if (logItem) logItem.content = state.fullTranscripts.join('\n\n'); 
           if (viewEl) viewEl.innerHTML = formatTranscriptContent(logItem.content, state.urls);
           if (editInputEl) editInputEl.value = logItem.content;
           
           state.currentIndex++;
        }
        
        if (progressEl) {
           progressEl.innerHTML = `<div style="color:var(--success); display:flex; align-items:center;"><i data-lucide="check-circle" style="width:14px; height:14px; margin-right:4px;"></i> 解析完成</div>`;
           setTimeout(() => {
             progressEl.style.display = 'none';
             if (actionsEl) actionsEl.style.display = 'flex';
           }, 3000);
        }
        lucide.createIcons();
        showToast("影音解析完成！");
        state.status = 'stopped';
        
      } catch(e) {
        if (e.message === "USER_STOPPED") {
            if (progressEl) {
              progressEl.innerHTML = `<div style="color:var(--danger); display:flex; align-items:center;"><i data-lucide="stop-circle" style="width:14px; height:14px; margin-right:4px;"></i> 已停止 (${state.currentIndex}/${state.urls.length})</div>`;
              setTimeout(() => {
                 progressEl.style.display = 'none';
                 if (actionsEl) actionsEl.style.display = 'flex';
              }, 3000);
            }
            showToast("解析已終止");
        } else {
            alert("解析過程中發生錯誤：" + e.message);
            if (progressEl) {
              progressEl.style.display = 'none';
              if (actionsEl) actionsEl.style.display = 'flex';
            }
        }
        state.status = 'stopped';
      } finally {
        if (btnEl) {
          btnEl.innerHTML = originalIconHtml;
          btnEl.disabled = false;
        }
        lucide.createIcons();
      }
  };

  window.pauseReAnalyze = function(logId) {

      }

  window.resumeReAnalyze = function(logId) {

    }

           if (actionsEl) actionsEl.style.display = 'flex';
         }, 3000);
       }
       lucide.createIcons();
       showToast("總結更新完成！");
       
       const logItem = globalLogsCache.find(l => l.logId === logId);
       if (logItem) logItem.summary = res.summary;
       
       isHistoryRendered = false;
       loadHistoryLogs(false);
    } catch(e) {
       alert("總結發生錯誤：" + e.message);
       if (progressEl) {
         progressEl.style.display = 'none';
         if (actionsEl) actionsEl.style.display = 'flex';

       btnEl.innerHTML = originalIconHtml;

  async function generateStepTitles() {
    if (!window.currentSelectedLog) { alert("請選日誌"); return; }
    const email = localStorage.getItem('bvlog_user_email');
    const container = document.getElementById('titleProposalContainer');
    container.innerHTML = '<div style="color: var(--accent); padding: 10px 0; display: flex; align-items: center; gap: 8px;"><i data-lucide="loader" class="spin"></i> 分析...</div>';
    lucide.createIcons();
    try {
      const cat = document.getElementById('articleCategorySelect').value;
      const res = await api({ action: "generateArticleStep", step: 1, content: window.currentSelectedLog.content, email: email, category: cat });
      const titles = res.titles || [];

      let htmlOutput = '';
      for(let i=0; i<titles.length; i++){
        const parts = titles[i].split('|||');
        const mainTitle = parts[0] ? parts[0].replace(/^[\d\.、\s]+/, '').trim() : titles[i].trim();
        const subTitle = parts[1] ? parts[1].trim() : '';
        htmlOutput += '<div class="title-option-card" style="flex-direction: column; align-items: flex-start;" onclick="selectTitle(\'' + escapeHtml(mainTitle).replace(/'/g, "\\'") + '\', this)"><div style="font-weight: 700; padding-right: 32px; color: var(--text);">' + (i + 1) + '. ' + escapeHtml(mainTitle) + '</div>' + (subTitle ? '<div style="font-size: 12.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.6;">' + escapeHtml(subTitle) + '</div>' : '') + '<i data-lucide="check" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; opacity: 0; transition: opacity 0.2s;"></i></div>';
      }

      container.innerHTML = htmlOutput;
      lucide.createIcons();
      showToast("完成");
    } catch (e) { container.innerHTML = '<div style="color: var(--danger); padding: 10px 0;">失敗: ' + e.message + '</div>'; }
  }

  function selectTitle(titleText, cardEl) {
    document.querySelectorAll('.title-option-card').forEach(c => {
      c.classList.remove('selected');
      const icon = c.querySelector('[data-lucide="check"]');
      if (icon) icon.style.opacity = '0';
    });
    cardEl.classList.add('selected');
    const checkIcon = cardEl.querySelector('[data-lucide="check"]');
    if (checkIcon) checkIcon.style.opacity = '1';
    document.getElementById('finalArticleTitle').value = titleText;
    saveCurrentStepData('title');
  }

  async function generateStepHook() {
    if (!window.currentSelectedLog) { alert("請載日誌"); return; }
    const title = document.getElementById('finalArticleTitle').value.trim();
    if (!title) { alert("缺標題"); return; }
    const email = localStorage.getItem('bvlog_user_email');
    const hookInput = document.getElementById('finalArticleHook');
    hookInput.value = "提煉中...";
    try {
      const cat = document.getElementById('articleCategorySelect').value;
      const res = await api({ action: "generateArticleStep", step: 2, title: title, content: window.currentSelectedLog.content, email: email, category: cat });
      
      if (res.hook === "（無輸出）") {
         hookInput.value = "[系統提示] 生成被安全機制阻擋，或產出為空。已取消自動儲存。\n請調整提示詞或檢查逐字稿後重試。";
         showToast("生成失敗，未儲存");
      } else {
         hookInput.value = res.hook || "";
         saveCurrentStepData('hook'); 
      }
    } catch (e) { hookInput.value = ""; alert(e.message); }
  }

    const endingInput = document.getElementById('finalArticleEnding');
    endingInput.value = "撰寫中...";
