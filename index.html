  function saveCurrentStepData(field) {
    if (!window.currentSelectedLog) { alert("未選日誌"); return; }
    let content = "";
    if (field === 'title') content = document.getElementById('finalArticleTitle').value;
    else if (field === 'hook') content = document.getElementById('finalArticleHook').value;
    else if (field === 'body') content = document.getElementById('finalArticleBody').value;
    else if (field === 'ending') content = document.getElementById('finalArticleEnding').value;
    else if (field === 'full') content = window.currentSelectedFullMd || "";

    const tier = document.getElementById('articleTier').value;
    const vipEmail = document.getElementById('articleVipEmail').value;
    const showVideo = document.getElementById('articleShowVideo') ? (document.getElementById('articleShowVideo').value === 'true') : true;
    const category = document.getElementById('articleCategorySelect') ? document.getElementById('articleCategorySelect').value : "未分類";

    if(field === 'title') window.currentSelectedLog.articleTitle = content;
    if(field === 'hook') window.currentSelectedLog.articleHook = content;
    if(field === 'body') window.currentSelectedLog.articleBody = content;
    if(field === 'ending') window.currentSelectedLog.articleEnding = content;
    if(field === 'full') {
       window.currentSelectedLog.articleFull = content;
       window.currentSelectedLog.articleTitle = document.getElementById('finalArticleTitle').value;
    }
    
    window.currentSelectedLog.tier = tier;
    window.currentSelectedLog.vipEmail = vipEmail;
    window.currentSelectedLog.showVideo = showVideo;
    window.currentSelectedLog.category = category;
    
    isDashboardRendered = false; 

    showToast("已儲存");

    api({ 
      action: "saveArticleSection", 
      logId: window.currentSelectedLog.logId, 
      field: field, 
      content: content,
      tier: tier,
      vipEmail: vipEmail,
      showVideo: showVideo,
      category: category
    }).catch (e => { showToast("背景儲存失敗"); });
  }

  async function triggerGithubPublish(logId) {
    const email = localStorage.getItem('bvlog_user_email');
    if(!email) return;
    const btn = event.currentTarget;
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '<i data-lucide="loader" class="spin" style="width:14px; height:14px;"></i> 發布';
    lucide.createIcons();
    btn.disabled = true;

    try {
      const res = await api({ action: "pushToGithub", email: email, logId: logId });
      showToast("已發布");
      isLogsFetched = false; 
      isDashboardRendered = false;
      if(document.getElementById('tab-dashboard').classList.contains('active')) loadDashboardLogs(false);
    } catch(e) {
      alert(e.message);
    } finally {
      btn.innerHTML = oldHtml;
      lucide.createIcons();
      btn.disabled = false;
    }
  }

  function publishArticleToWeb() { 
    if(!window.currentSelectedLog) return;
    triggerGithubPublish(window.currentSelectedLog.logId);
  }

  async function deploySingleArticle(logId, btn) {
    const email = localStorage.getItem('bvlog_user_email');
    if (!email) return;

    if (!confirm("確定要將這篇文章的「最新內容」部署到 GitHub 嗎？\n\n(系統將會自動套用最頂級的 SEO 結構化資料，並同時更新您的沙龍首頁！)")) return;

    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<i data-lucide="loader" class="spin" style="width:14px; height:14px;"></i> 部署中...';
    lucide.createIcons();
    btn.disabled = true;

    try {
      await api({ action: "pushToGithub", email: email, logId: logId });
      showToast("單篇部署完成！已推播至 GitHub");
      
      isLogsFetched = false; 
      isDashboardRendered = false;
      loadDashboardLogs(false);
    } catch (e) {
      alert("部署失敗：" + e.message);
      btn.innerHTML = originalHtml;
      lucide.createIcons();
      btn.disabled = false;
    }
  }

  function deleteHistoryLog(logId) {
    if (!confirm("確定刪除此文章/草稿嗎？\n(此操作將同步清空紀錄，若已發布將自動移除 GitHub 單頁並重構首頁)")) return;
    const email = localStorage.getItem('bvlog_user_email');

    globalLogsCache = globalLogsCache.filter(l => l.logId !== logId);
    isHistoryRendered = false;
    isDashboardRendered = false;
    if(document.getElementById('tab-history').classList.contains('active')) loadHistoryLogs(false);
    if(document.getElementById('tab-dashboard').classList.contains('active')) loadDashboardLogs(false);
    
    showToast("已從列表中移除，背景同步刪除遠端...");

    api({ action: "deleteLogAndGithub", logId: logId, email: email }).then(res => {
        showToast("遠端與 GitHub 頁面已同步清空");
    }).catch(e => {
        showToast("遠端刪除異常: " + e.message);
        isLogsFetched = false; 
    });
  }

  function toggleEditMode(logId, field) {
    const viewEl = document.getElementById('view-' + field + '-' + logId);
    const editEl = document.getElementById('edit-' + field + '-' + logId);
    const editBtn = document.getElementById('btn-edit-' + field + '-' + logId);
    if (editEl.style.display === "none") {
      viewEl.style.display = "none"; editEl.style.display = "flex"; if(editBtn) editBtn.style.display = "none"; 
    } else {
      viewEl.style.display = "block"; editEl.style.display = "none"; if(editBtn) editBtn.style.display = "inline-flex";
    }
  }

  function saveHistoryLog(logId, field, btnElement) {
    const textarea = document.getElementById('input-' + field + '-' + logId);
    const newText = textarea.value;

    const logItem = globalLogsCache.find(l => l.logId === logId);
    if (logItem) {
      if (field === 'summary') logItem.summary = newText;
      if (field === 'content') logItem.content = newText;
    }

    const viewEl = document.getElementById('view-' + field + '-' + logId);
    if (viewEl) {
      if (field === 'content') {
          viewEl.innerHTML = formatTranscriptContent(newText, window.logPlaylists[logId]);
      } else {
          viewEl.innerHTML = renderMarkdown(newText);
      }
    }

    toggleEditMode(logId, field);
    showToast("已儲存");

    api({ action: "updateLog", logId: logId, field: field, newText: newText }).catch(e => {
      showToast("背景儲存失敗");
    });
  }

  async function generateStepTitles() {
    if (!window.currentSelectedLog) { alert("請選日誌"); return; }
    const email = localStorage.getItem('bvlog_user_email');
    const container = document.getElementById('titleProposalContainer');
    container.innerHTML = '<div style="color: var(--accent); padding: 10px 0; display: flex; align-items: center; gap: 8px;"><i data-lucide="loader" class="spin"></i> 分析...</div>';
    lucide.createIcons();
    try {
      const cat = document.getElementById('articleCategorySelect').value;
      const res = await api({ action: "generateArticleStep", step: 1, content: window.currentSelectedLog.content, email: email, category: cat });
      const titles = res.titles || [];

      let htmlOutput = '';
      for(let i=0; i<titles.length; i++){
        const parts = titles[i].split('|||');
        const mainTitle = parts[0] ? parts[0].replace(/^[\d\.、\s]+/, '').trim() : titles[i].trim();
        const subTitle = parts[1] ? parts[1].trim() : '';
        htmlOutput += '<div class="title-option-card" style="flex-direction: column; align-items: flex-start;" onclick="selectTitle(\'' + escapeHtml(mainTitle).replace(/'/g, "\\'") + '\', this)"><div style="font-weight: 700; padding-right: 32px; color: var(--text);">' + (i + 1) + '. ' + escapeHtml(mainTitle) + '</div>' + (subTitle ? '<div style="font-size: 12.5px; color: var(--text-muted); margin-top: 6px; line-height: 1.6;">' + escapeHtml(subTitle) + '</div>' : '') + '<i data-lucide="check" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; opacity: 0; transition: opacity 0.2s;"></i></div>';
      }

      container.innerHTML = htmlOutput;
      lucide.createIcons();
      showToast("完成");
    } catch (e) { container.innerHTML = '<div style="color: var(--danger); padding: 10px 0;">失敗: ' + e.message + '</div>'; }
  }

  function selectTitle(titleText, cardEl) {
    document.querySelectorAll('.title-option-card').forEach(c => {
      c.classList.remove('selected');
      const icon = c.querySelector('[data-lucide="check"]');
      if (icon) icon.style.opacity = '0';
    });
    cardEl.classList.add('selected');
    const checkIcon = cardEl.querySelector('[data-lucide="check"]');
    if (checkIcon) checkIcon.style.opacity = '1';
    document.getElementById('finalArticleTitle').value = titleText;
    saveCurrentStepData('title');
  }

  async function generateStepHook() {
    if (!window.currentSelectedLog) { alert("請載日誌"); return; }
    const title = document.getElementById('finalArticleTitle').value.trim();
    if (!title) { alert("缺標題"); return; }
    const email = localStorage.getItem('bvlog_user_email');
    const hookInput = document.getElementById('finalArticleHook');
    hookInput.value = "提煉中...";
    try {
      const cat = document.getElementById('articleCategorySelect').value;
      const res = await api({ action: "generateArticleStep", step: 2, title: title, content: window.currentSelectedLog.content, email: email, category: cat });
      
      if (res.hook === "（無輸出）") {
         hookInput.value = "[系統提示] 生成被安全機制阻擋，或產出為空。已取消自動儲存。\n請調整提示詞或檢查逐字稿後重試。";
         showToast("生成失敗，未儲存");
      } else {
         hookInput.value = res.hook || "";
         saveCurrentStepData('hook'); 
      }
    } catch (e) { hookInput.value = ""; alert(e.message); }
  }

  async function generateStepBody() {
    if (!window.currentSelectedLog) { alert("請載日誌"); return; }
    const title = document.getElementById('finalArticleTitle').value.trim();
    const hook = document.getElementById('finalArticleHook').value.trim();
    if (!title) { alert("缺標題"); return; }
    const email = localStorage.getItem('bvlog_user_email');
    const bodyInput = document.getElementById('finalArticleBody');
    bodyInput.value = "重構中...";
    try {
      const cat = document.getElementById('articleCategorySelect').value;
      const res = await api({ action: "generateArticleStep", step: 3, title: title, hook: hook, content: window.currentSelectedLog.content, email: email, category: cat });
      
      if (res.body === "（無輸出）") {
         bodyInput.value = "[系統提示] 生成被安全機制阻擋，或產出為空。已取消自動儲存。\n請調整提示詞或檢查逐字稿後重試。";
         showToast("生成失敗，未儲存");
      } else {
         bodyInput.value = res.body || "";
         saveCurrentStepData('body');
      }
    } catch (e) { bodyInput.value = ""; alert(e.message); }
  }

  async function generateStepEnding() {
    const title = document.getElementById('finalArticleTitle').value.trim();
    const email = localStorage.getItem('bvlog_user_email');
    const endingInput = document.getElementById('finalArticleEnding');
    endingInput.value = "撰寫中...";
    try {
      const cat = document.getElementById('articleCategorySelect').value;
      const res = await api({ action: "generateArticleStep", step: 4, title: title, email: email, category: cat });
      
      if (res.ending === "（無輸出）") {
         endingInput.value = "[系統提示] 生成被安全機制阻擋，或產出為空。已取消自動儲存。\n請調整提示詞後重試。";
         showToast("生成失敗，未儲存");
      } else {
         endingInput.value = res.ending || "";
         saveCurrentStepData('ending');
      }
    } catch (e) { 
      endingInput.value = ""; 
      alert(e.message); 
    }
  }

</script>
